# Security headers, factored out so they can be re-included per location.
#
# nginx does NOT merge add_header directives down into a location block that
# declares any add_header of its own — the inner set replaces the outer set
# entirely. Both cache-controlling locations therefore have to pull these back
# in explicitly, or they would serve the app shell with no CSP at all.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# The dashboard needs OpenStreetMap tiles from CARTO and nothing else
# off-origin. Tiles arrive as <img>, so they belong in img-src. Inline styles
# are unavoidable: React, Recharts and Leaflet all set element.style directly.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
