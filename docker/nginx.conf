# Main nginx config, replacing the stock one.
#
# The stock config assumes a root master process: it writes its pid to
# /var/run and its scratch files under /var/cache/nginx. This image runs as an
# unprivileged user on a read-only root filesystem, where both of those are
# either unwritable or masked by a tmpfs mounted root-owned. Pointing every
# writable path at /tmp means the container needs exactly one writable mount
# and no uid-matching tmpfs options at the call site.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
